name: Build and publish laboratory
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check application syntax
        run: |
          node --check static/app.js
          node --check static/browser-runtime.js
          node --check static/solver-worker.js
          node --check static/report-ui.js
          node --check static/workspace-3d.js
          node --check static/editor-2d.js
          node --check static/viewer-3d.js
      - name: Verify vendored solver
        working-directory: static/vendor/packingsolver
        run: sha256sum --check SHA256SUMS
      - name: Verify real solver and lifecycle
        run: |
          node tests/browser_wasm.test.cjs
          node tests/browser_runtime.test.cjs
          node --test tests/browser_loader.test.cjs
          node --test tests/browser_serviceworker.test.cjs
          node tests/browser_baseline.test.cjs
          node --test tests/browser_geometry.test.cjs
      - name: Audit public inputs and assemble static application
        run: |
          python scripts/audit_distribution.py
          python build_site.py
          python scripts/verify_static_build.py
          python -m unittest discover -s tests -p test_publication.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
